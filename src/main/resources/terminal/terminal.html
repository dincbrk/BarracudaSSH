<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="xterm.css" />
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden; /* Hide scrollbars, xterm handles it */
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        /* Custom scrollbar for webkit to make it look native and dark */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #111; 
        }
        ::-webkit-scrollbar-thumb {
            background: #444; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        var term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#000000',
                foreground: '#BBBBBB'
            },
            fontFamily: '"Courier New", Courier, monospace',
            fontSize: 14
        });
        var fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();



        let resizeTimeout;
        const resizeObserver = new ResizeObserver(() => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                triggerResize();
            }, 100);
        });
        resizeObserver.observe(document.getElementById('terminal-container'));

        // Inject token generated by Java backend for secure local IPC
        const token = "{{TOKEN}}";

        // Send data to Java via HTTP
        term.onData(function(data) {
            const encoder = new TextEncoder();
            fetch("/input?token=" + token, {
                method: "POST",
                body: encoder.encode(data)
            }).catch(e => console.error(e));
        });

        term.onResize(function(size) {
            fetch("/resize?token=" + token, {
                method: "POST",
                body: size.cols + "," + size.rows
            }).catch(e => console.error(e));
        });

        // Trigger an initial resize event when xterm.js has loaded
        function triggerResize() {
            try {
                fitAddon.fit();
                if (term.rows && term.cols) {
                    fetch("/resize?token=" + token, {
                        method: "POST",
                        body: term.cols + "," + term.rows
                    }).catch(e => console.error(e));
                }
            } catch(e) {}
        }

        // Poll for data from Java
        async function pollData() {
            while(true) {
                try {
                    let res = await fetch("/poll?token=" + token);
                    if (res.ok) {
                        let data = await res.arrayBuffer();
                        if (data.byteLength > 0) {
                            term.write(new Uint8Array(data));
                        }
                    } else {
                        await new Promise(r => setTimeout(r, 500));
                    }
                } catch(e) {
                    await new Promise(r => setTimeout(r, 500));
                }
            }
        }

        // Start polling
        pollData();

        // Initial setup with a slight delay to ensure SSH channel is open
        setTimeout(() => {
            triggerResize();
        }, 500);
        setTimeout(() => {
            triggerResize();
        }, 1500);
    </script>
</body>
</html>
